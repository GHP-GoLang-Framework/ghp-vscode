name: Release

# Triggered by a version tag (vX.Y.Z), pushed after bumping "version" in
# package.json — see the "Releasing" section in README.md. Packages the
# extension, publishes it to the VS Code Marketplace, and attaches the
# .vsix to a GitHub Release either way, so a release always leaves a
# downloadable artifact even before the Marketplace publish is wired up.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Package & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test grammar
        run: npm test

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Package extension
        run: npx @vscode/vsce package

      # Uses a classic Personal Access Token (VSCE_TOKEN repo secret) via
      # `vsce publish`. Azure DevOps retires global PATs on 2026-12-01; after
      # that this step needs to move to Entra ID / workload identity
      # federation (Azure Pipelines-only today, no GitHub Actions-native
      # equivalent yet) — see
      # https://code.visualstudio.com/api/working-with-extensions/publishing-extension#secure-automated-publishing-to-visual-studio-marketplace
      - name: Publish to VS Code Marketplace
        if: ${{ secrets.VSCE_TOKEN != '' }}
        run: npx @vscode/vsce publish --packagePath *.vsix -p "${{ secrets.VSCE_TOKEN }}"

      - name: Marketplace publish skipped
        if: ${{ secrets.VSCE_TOKEN == '' }}
        run: |
          echo "::warning::VSCE_TOKEN secret is not set — skipping Marketplace publish. The .vsix is still attached to the GitHub Release below. See README.md for how to create a publisher and token."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" *.vsix --clobber
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag *.vsix
