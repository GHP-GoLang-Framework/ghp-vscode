name: Release

# Triggered by a version tag (vX.Y.Z), pushed after bumping "version" in
# package.json — see the "Releasing" section in README.md. Packages the
# extension and attaches the .vsix to a GitHub Release; not published to
# the VS Code Marketplace — install it manually from the release assets
# (VSCode: Extensions view -> "..." -> Install from VSIX...).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Package & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test grammar
        run: npm test

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Package extension
        run: npx @vscode/vsce package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" *.vsix --clobber
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag *.vsix
